<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC测试</title>
    <meta name="description" content="webrtc测试">
    <meta name="keywords" content="voice9,webrtc测试,杭州祎声科技">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
    }

    .d-flex {
        display: flex;
    }

    .align-center {
        align-items: center;
    }

    .w-50 {
        width: 50%;
        margin: 5px;
    }

    .h-90 {
        height: 90vh;
    }

    fieldset {
        padding: 20px
    }

    label {
        width: 130px;
        margin-right: 10px;
    }

    button {
        padding: 5px 15px;
    }

    #messageBody {
        height: 100%;
        overflow: auto;
    }

    fieldset {
        margin-bottom: 15px;
    }

    .divBox {
        margin-bottom: 20px;
    }
</style>
<script src="libs/jquery/3.5.1/jquery.min.js"></script>
<script src="libs/crypto-js/4.1.1/core.js"></script>
<script src="libs/crypto-js/4.1.1/sha256.js"></script>
<script src="2.4.0/voice9.sdk.js"></script>

<script type="module">
    import Voice9 from './2.4.0/voice9.sdk.js'

    const voice9 = new Voice9();

    let domain = window.location.origin;
    // let domain = "https://dev.voice9.com";

    voice9.addEventListener('message', (data) => {
        let msg = JSON.stringify(data);
        if (data.type === 'pong') {
            return;
        }
        if (data.type === 'LOGIN') {
            $("#loginBtn").prop("disabled", true);
            $("#logoutBtn").prop("disabled", false);
        }
        messageBody.innerHTML += `<br>${msg}</br>`;
    })
    voice9.addEventListener('logout', (data) => {
        $("#loginBtn").prop('disabled', false);
        $("#logoutBtn").prop('disabled', true);
        messageBody.innerHTML += `<br>logout</br>`;
    });

    //登录
    loginBtn.addEventListener('click', () => {
        try {
            let data = {
                agentKey: $('#agentKey').val(),
                passwd: CryptoJS.SHA256($('#passwd').val()).toString(),
                agentCode: $('#agentCode').val(),
                loginType: $('#loginType').val(),
                workType: $('#workType').val(),
                loginState: "READY",
                webHook: "https://dev.voice9.com/cc-ivr/index/push"
            };
            $.ajax({
                type: "POST",
                url: domain + "/fs-api/index/login",
                contentType: "application/json",
                dataType: "json",
                data: JSON.stringify(data),
                success: function (res) {
                    if (res.code !== 0) {
                        alert(res.message);
                        return;
                    }
                    voice9.init(res.data);
                }
            });
        } catch (e) {
            alert('登录信息格式错误,请检查是否是标准格式的json')
        }
    });

    // 登出
    logoutBtn.addEventListener('click', () => {
        voice9.logout();
    });

    // 设置忙碌
    busyBtn.addEventListener('click', () => {
        voice9.setNotReady();
    });
    // 设置空闲
    readyBtn.addEventListener('click', () => {
        voice9.setReady();
    });

    //自定义忙碌
    workNotReadyBtn.addEventListener('click', () => {
        voice9.setWorkNotReady(workNotReady.value);
    });

    //外呼
    makeCallBtn.addEventListener('click', () => {
        voice9.makeCall(phoneNum.value);
    });
    //外呼(随路数据)
    followDataMakeCallBtn.addEventListener('click', () => {
        voice9.makeCallByFollowData(phoneNum.value, JSON.stringify(followDataMakeCallData.value));
    });
    // 接听电话
    acceptCallBtn.addEventListener('click', () => {
        voice9.acceptCall();
    });
    // 挂断电话
    closeCallBtn.addEventListener('click', () => {
        voice9.hangupCall();
    });

    //转接
    phoneTransferBtn.addEventListener('click', () => {
        voice9.phoneTransfer(phoneTransfertNum.value);
    });

    //咨询
    phoneConsultBtn.addEventListener('click', () => {
        voice9.phoneConsult(phoneConsultNum.value);
    })
    //取消咨询
    phoneConsultCancelBtn.addEventListener('click', () => {
        voice9.phoneConsultCancel();
    })
    //结束咨询
    phoneConsultStopBtn.addEventListener('click', () => {
        voice9.phoneConsultStop();
    })
    //咨询转接
    phoneConsultTransferBtn.addEventListener('click', () => {
        voice9.phoneConsultTransfer(phoneConsultTransfer.value)
    });
    //咨询转多方
    phoneConsultPartyBtn.addEventListener('click', () => {
        voice9.phoneConsultParty();
    })


    // 静音
    mutePhoneBtn.addEventListener('click', () => {
        voice9.mutePhone();
    })
    // 取消静音
    muteCancelBtn.addEventListener('click', () => {
        voice9.muteCancel();
    })
    // 保持
    holdTalkingBtn.addEventListener('click', () => {
        voice9.holdTalking();
    })
    // 取消保持
    cancelHoldBtn.addEventListener('click', () => {
        voice9.holdCancel();
    })

    //开启对方视频
    startVideo.addEventListener('click', () => {
        voice9.startVideo();
    })

    //发送dtmf
    dtmfBtn.addEventListener('click', () => {
        voice9.sendDtmf(dtmf.value);
    });

    //更新随路数据
    updateFollowDataBtn.addEventListener('click', () => {
        voice9.updateCallFollowData(JSON.stringify(followData.value), "123456", "654321", "a", "b", "c", "d", "e");
    });

    //自定义消息
    customMessageBtn.addEventListener('click', () => {
        voice9.customMessage(JSON.stringify(customMessage.value));
    });

    //监听
    monitorBtn.addEventListener('click', () => {
        if (monitorAgent.value === '' || monitorCallId.value === '') {
            alert("参数错误");
            return;
        }
        voice9.monitorCall(monitorAgent.value, monitorCallId.value);
    })

    //取消监听
    monitorCancelBtn.addEventListener('click', () => {
        voice9.hangupCall();
    })

    //强拆
    interceptBtn.addEventListener('click', () => {
        voice9.interceptCall();
    })

    //强插
    bargeBtn.addEventListener('click', () => {
        if (bargeAgent.value === '' || bargeCallId.value === '') {
            alert("参数错误");
            return;
        }
        voice9.bargeCall(bargeAgent.value, bargeCallId.value);
    })

    //辅导
    coachBtn.addEventListener('click', () => {
        if (coachAgent.value === '' || coachCallId.value === '') {
            alert("参数错误");
            return;
        }
        voice9.coachCall(coachAgent.value, coachCallId.value);
    })


    //清除日志
    messageBtn.addEventListener('click', () => {
        while (messageBody.childNodes.length > 0) {
            messageBody.removeChild(messageBody.firstChild);
        }
    });

</script>

<body>
<div class="d-flex">
    <div class="w-50">
        <fieldset>
            <legend>登录参数</legend>
            <div class="d-flex align-center">
                账号：<input name="agentKey" id="agentKey" value="1001@test" style="width: 90px"/>
                密码：<input name="passwd" id="passwd" type="password" value="123456" style="width: 90px"/>
                分机：<input name="agentCode" id="agentCode" style="width: 90px"/>
                接听方式：
                <select id="loginType" name="loginType">
                    <option value="1">sip号</option>
                    <option value="2" selected>webrtc</option>
                    <option value="3">手机号</option>
                </select>
                工作类型：
                <select id="workType" name="workType">
                    <option value="1" selected>普通</option>
                    <option value="2">预测</option>
                </select>

                <audio id="peerVideo" autoplay></audio>
                <audio id="remoteVideo" autoplay></audio>
            </div>
            <div>
                <button id="loginBtn">登录</button>
                <button id="logoutBtn" disabled="true">退出</button>
            </div>
        </fieldset>

        <fieldset>
            <legend>登录状态</legend>
            <div>
                <button id="busyBtn">忙碌</button>
                <button id="readyBtn">空闲</button>
                <button id="workNotReadyBtn">自定义忙碌</button>
                :<input id="workNotReady" type="input" value="1"></input>
            </div>

        </fieldset>

        <fieldset>
            <legend>通话</legend>
            <div class="divBox">
                <div>
                    <button id="makeCallBtn">外呼</button>
                    <label for="phoneNum">外呼</label>
                    <input id="phoneNum" type="text" value="13300001234"></input>
                    <button id="acceptCallBtn">应答</button>
                    <button id="closeCallBtn">挂机</button>
                </div>
                </br>
                <div>
                    <p><textarea style="width: 480px; height: 35px;" id="followDataMakeCallData">{"123": "aaa", "456": "bbb"} </textarea>
                    </p>
                    <button id="followDataMakeCallBtn">外呼(随路数据)</button>
                </div>
            </div>
            <div class="divBox">
                <div>
                    <button id="phoneTransferBtn">转接</button>
                    <input id="phoneTransfertNum" type="text" value="1002@test"></input>
                </div>
            </div>
            <div class="divBox">
                <div>
                    <button id="phoneConsultBtn">咨询</button>
                    <button id="phoneConsultCancelBtn">取消咨询</button>
                    <button id="phoneConsultStopBtn">结束咨询</button>
                    <input id="phoneConsultNum" type="text" value="1002@test"></input>
                </div>
            </div>
            <div class="divBox">
                <div>
                    <button id="phoneConsultTransferBtn">咨询转接</button>
                    <button id="phoneConsultPartyBtn">转多方会议</button>
                    <input id="phoneConsultTransfer" type="text" value="1002@test"></input>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>通话状态</legend>
            <div>
                <button id="mutePhoneBtn">静音</button>
                <button id="muteCancelBtn">取消静音</button>
                <button id="holdTalkingBtn">保持</button>
                <button id="cancelHoldBtn">取消保持</button>
                <button id="startVideo">开启对方视频</button>
            </div>
            <br>
            <div>
                <button id="dtmfBtn">发送按键</button>
                <input id="dtmf" type="input" value="1234"></input>
            </div>
            <br>
            <div>
                <p><textarea style="width: 480px; height: 35px;"
                             id="followData">{"aaa": "123", "bbb": "456"} </textarea></p>
                <button id="updateFollowDataBtn">更新随路数据</button>
            </div>
            <br>
            <div>
                <p><textarea style="width: 480px; height: 55px;" id="customMessage"></textarea></p>
                <button id="customMessageBtn">自定义消息</button>
            </div>
        </fieldset>

        <fieldset>
            <legend>班长监控</legend>
            <div>
                <button id="monitorBtn">监听</button>
                坐席：<input id="monitorAgent"/>
                callId：<input id="monitorCallId"/>
            </div>
            <br>
            <div>
                <button id="monitorCancelBtn">取消监听</button>
                <button id="interceptBtn">强拆</button>
            </div>
            <br>
            <div>
                <button id="bargeBtn">强插</button>
                坐席：<input id="bargeAgent"/>
                callId：<input id="bargeCallId"/>
            </div>
            <br>
            <div>
                <button id="coachBtn">辅导</button>
                坐席：<input id="coachAgent"/>
                callId：<input id="coachCallId"/>
            </div>
        </fieldset>

    </div>
    <div class="w-50">
        <fieldset class="h-90">
            <legend>消息体</legend>
            <div id="messageBody"></div>
            <button id="messageBtn">清除</button>
        </fieldset>
    </div>
</div>
</body>
</html>
